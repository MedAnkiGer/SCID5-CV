<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SCID-5-CV{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root { --teal: #00897B; --teal-dark: #00695C; --teal-light: #B2DFDB; }
    body { background: #F5F7F7; font-family: system-ui, sans-serif; }
    .navbar { background: var(--teal-dark) !important; }
    .navbar-brand { color: #fff !important; font-weight: 600; letter-spacing: .5px; }
    .btn-teal  { background: var(--teal); color: #fff; border: none; }
    .btn-teal:hover { background: var(--teal-dark); color: #fff; }
    .btn-outline-teal { border: 1px solid var(--teal); color: var(--teal); }
    .btn-outline-teal:hover { background: var(--teal); color: #fff; }
    .card { border: none; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    .stage-badge { font-size: .75rem; padding: .3em .7em; border-radius: 20px;
                   background: var(--teal-light); color: var(--teal-dark); font-weight: 600; }
    .progress-bar { background: var(--teal); }
    .spinner-border { width: 1.2rem; height: 1.2rem; border-width: .15em; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">SCID-5-CV Assessment</a>
    {% if session is defined and session %}
    <span class="text-white-50 small">Session {{ session.session_id }}
      &nbsp;&middot;&nbsp; <span class="stage-badge">{{ session.stage }}</span>
    </span>
    {% endif %}
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
